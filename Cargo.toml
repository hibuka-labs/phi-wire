[workspace]
members = ["crates/protocol", "crates/adapter", "crates/client"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/hibuka-labs/phi-wire"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
phi-wire-protocol = { path = "crates/protocol", version = "0.1.0" }
phi-wire-adapter = { path = "crates/adapter", version = "0.1.0" }
